
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高中題庫管理系統</title>
<style>
:root {
  --main: #1677e8;
  --main-dark: #075fc5;
  --bg: #f2f5fa;
  --card: rgba(255, 255, 255, 0.76);
  --text: #172337;
  --muted: #748197;
  --line: rgba(140, 158, 184, 0.20);
  --glass: rgba(255, 255, 255, 0.66);
  --shadow: 0 8px 32px rgba(38, 61, 96, 0.07);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", "Noto Sans TC", "Segoe UI", sans-serif;
  background:
    radial-gradient(ellipse at 10% 0%, #dceaff 0, transparent 42%),
    radial-gradient(ellipse at 100% 30%, #e5e7ff 0, transparent 38%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

header {
  position: relative;
  overflow: hidden;
  padding: 38px 24px 34px;
  color: white;
  background: linear-gradient(135deg, #267ff0, #5b9bfa 60%, #8cbaff);
  border-radius: 0 0 32px 32px;
  box-shadow: 0 12px 35px rgba(39, 119, 231, 0.19);
}

header::after {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 50%;
  right: -65px;
  top: -100px;
  box-shadow:
    0 0 0 25px rgba(255,255,255,.06),
    0 0 0 55px rgba(255,255,255,.04);
  pointer-events: none;
}

header h1 {
  position: relative;
  z-index: 1;
  margin: 0 0 7px;
  font-size: clamp(25px, 4vw, 34px);
  font-weight: 750;
  letter-spacing: -0.7px;
}

header p {
  position: relative;
  z-index: 1;
  margin: 0;
  font-size: 14px;
  color: rgba(255,255,255,.88);
}

main {
  width: min(1000px, 100%);
  margin: 28px auto;
  padding: 0 20px 36px;
}

.card {
  padding: 26px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,.85);
  border-radius: 25px;
  background: var(--card);
  box-shadow: var(--shadow);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  transition: box-shadow .25s ease, transform .25s ease;
}

h2 {
  margin: 0 0 20px;
  font-size: 20px;
  font-weight: 720;
  letter-spacing: -.3px;
}

.filters {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}

select,
input {
  width: 100%;
  min-height: 46px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,.82);
  color: var(--text);
  font: inherit;
  font-size: 15px;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
}

select:focus,
input:focus {
  border-color: rgba(22,119,232,.65);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(22,119,232,.10);
}

button {
  min-height: 44px;
  padding: 11px 19px;
  border: 1px solid transparent;
  border-radius: 15px;
  background: linear-gradient(135deg, #2785f5, #1269d8);
  color: white;
  font: inherit;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(22,119,232,.16);
  transition: transform .18s ease, box-shadow .18s ease, opacity .18s;
}

button:hover {
  box-shadow: 0 7px 18px rgba(22,119,232,.23);
  transform: translateY(-1px);
}

button:active {
  transform: scale(.97);
  box-shadow: none;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}

button.secondary {
  background: rgba(230,239,252,.85);
  color: #225b9c;
  border-color: rgba(155,185,224,.2);
  box-shadow: none;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 19px;
}

.status {
  margin-top: 14px;
  padding: 10px 13px;
  border-radius: 12px;
  background: rgba(231,239,250,.55);
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.question {
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
  break-inside: avoid;
}

.question:last-child {
  border-bottom: 0;
}

.q-title {
  margin-bottom: 12px;
  font-weight: 680;
  line-height: 1.85;
}

.option {
  margin: 8px 0 8px 10px;
  padding: 9px 12px;
  border-radius: 11px;
  background: rgba(239,244,251,.55);
  line-height: 1.75;
}

.answer {
  margin-top: 12px;
  padding: 11px 14px;
  border-radius: 12px;
  background: rgba(220,246,233,.72);
  color: #176b4a;
  font-weight: 600;
}

.explanation {
  margin-top: 8px;
  color: var(--muted);
  font-size: 14px;
}

.small {
  color: var(--muted);
  font-size: 13px;
}

#paperTitle {
  margin-bottom: 8px;
}

#paperInfo {
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

::selection {
  background: rgba(22,119,232,.2);
}

@media (max-width: 600px) {
  header {
    padding: 30px 20px 27px;
    border-radius: 0 0 26px 26px;
  }

  main {
    margin: 18px auto;
    padding: 0 12px 26px;
  }

  .card {
    padding: 19px;
    border-radius: 21px;
    margin-bottom: 15px;
  }

  h2 {
    font-size: 18px;
  }

  .filters {
    grid-template-columns: 1fr;
    gap: 13px;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 9px;
  }

  button {
    width: 100%;
    min-height: 46px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

@media print {
  body {
    background: white;
    color: black;
  }

  header, #settings, #toolbar, .no-print {
    display: none !important;
  }

  main {
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .card {
    box-shadow: none;
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 0;
    background: white;
    backdrop-filter: none;
  }

  #paper {
    display: block !important;
  }

  #paperInfo {
    color: black;
  }

  .question {
    padding: 12px 0;
  }

  .option,
  .answer {
    background: white;
    color: black;
    border: 1px solid #ddd;
  }

  .explanation {
    color: black;
  }
}
</style>
</head>
<body>
<header>
  <h1>高中題庫管理系統</h1>
  <p>快速組卷與列印</p>
</header>

<main>
  <section class="card" id="settings">
    <h2>📚 題庫與篩選</h2>
    <div class="filters">
      <div>
        <label for="subject">科目</label>
        <select id="subject"><option value="">全部科目</option></select>
      </div>
      <div>
        <label for="chapter">章節</label>
        <select id="chapter"><option value="">全部章節</option></select>
      </div>
      <div>
        <label for="type">題型</label>
        <select id="type"><option value="">全部題型</option></select>
      </div>
      <div>
        <label for="difficulty">難度</label>
        <select id="difficulty"><option value="">全部難度</option></select>
      </div>
      <div>
        <label for="count">抽題數量</label>
        <input id="count" type="number" min="1" value="10">
      </div>
      <div>
        <label for="titleInput">試卷標題</label>
        <input id="titleInput" value="高中練習試卷">
      </div>
      <div>
        <label for="points">每題預設配分</label>
        <input id="points" type="number" min="0" value="2">
      </div>
    </div>
    <div class="actions">
      <button id="loadBtn" onclick="loadQuestions()">重新讀取題庫</button>
      <button onclick="makePaper()">🎲 隨機組卷</button>
    </div>
    <div class="status" id="status">正在準備讀取題庫……</div>
  </section>

  <section class="card" id="toolbar">
    <h2>📝 試卷預覽</h2>
    <div class="actions">
      <button onclick="printPaper(false)">列印試卷／另存 PDF</button>
      <button class="secondary" onclick="printPaper(true)">列印答案卷／另存 PDF</button>
      <button class="secondary" onclick="showAnswers()">顯示／隱藏答案</button>
    </div>
    <p class="small">列印時可在瀏覽器的目的地選擇「另存為 PDF」。</p>
  </section>

  <section class="card" id="paper">
    <h2 id="paperTitle">高中練習試卷</h2>
    <div id="paperInfo" class="small"></div>
    <div id="questions">
      尚未組卷。請先讀取題庫，再按「隨機組卷」。
    </div>
  </section>
</main>

<script>
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9PKH0Ygpd73cQDqx0RrFgQLmkY_X6GEDE__0PpGgWRyEHDb6SDns8D_EM1D319sr2BwuyZGvJZST_/pub?gid=0&single=true&output=csv";

let allQuestions = [];
let paperQuestions = [];
let answersVisible = false;
let printAnswersOnly = false;

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;
  text = text.replace(/^\uFEFF/, "");

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === '"') {
      if (quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (c === "," && !quoted) {
      row.push(cell);
      cell = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell);
      if (row.some(v => v.trim() !== "")) rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += c;
    }
  }

  if (cell.length || row.length) {
    row.push(cell);
    if (row.some(v => v.trim() !== "")) rows.push(row);
  }

  if (!rows.length) return [];

  const headers = rows.shift().map(h => h.trim());
  return rows.map(values => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (values[i] || "").trim());
    return obj;
  });
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}

async function loadQuestions() {
  const status = document.getElementById("status");
  const btn = document.getElementById("loadBtn");
  status.textContent = "正在連線讀取 Google 試算表……";
  btn.disabled = true;

  try {
    const response = await fetch(CSV_URL);
    if (!response.ok) throw new Error("HTTP " + response.status);

    const text = await response.text();
    if (text.trim().startsWith("<")) {
      throw new Error("收到的不是 CSV，請確認試算表已發布為 CSV。");
    }

    const rows = parseCSV(text);
    if (!rows.length) throw new Error("表格沒有題目資料。");

    allQuestions = rows.filter(q => q["題目"]);

    if (!allQuestions.length) {
      throw new Error("找不到「題目」欄，請確認第一列欄位名稱。");
    }

    ["subject", "chapter", "type", "difficulty"].forEach(id => {
      const key = {
        subject: "科目",
        chapter: "章節",
        type: "題型",
        difficulty: "難度"
      }[id];

      const select = document.getElementById(id);
      const previous = select.value;
      const label = {
        subject: "全部科目",
        chapter: "全部章節",
        type: "全部題型",
        difficulty: "全部難度"
      }[id];

      const values = [...new Set(
        allQuestions.map(q => q[key]).filter(Boolean)
      )].sort();

      select.innerHTML =
        `<option value="">${label}</option>` +
        values.map(v =>
          `<option value="${escapeHTML(v)}">${escapeHTML(v)}</option>`
        ).join("");

      if (values.includes(previous)) select.value = previous;
    });

    status.textContent = `讀取成功，共 ${allQuestions.length} 題。`;
  } catch (err) {
    status.textContent =
      "讀取失敗：" + err.message +
      "。請確認 CSV 公開權限、欄位名稱及網路連線。";
  } finally {
    btn.disabled = false;
  }
}

function filteredQuestions() {
  return allQuestions.filter(q =>
    (!document.getElementById("subject").value ||
      q["科目"] === document.getElementById("subject").value) &&
    (!document.getElementById("chapter").value ||
      q["章節"] === document.getElementById("chapter").value) &&
    (!document.getElementById("type").value ||
      q["題型"] === document.getElementById("type").value) &&
    (!document.getElementById("difficulty").value ||
      q["難度"] === document.getElementById("difficulty").value)
  );
}

function makePaper() {
  const pool = filteredQuestions();
  const count = Math.max(1, Number(document.getElementById("count").value) || 1);

  if (!pool.length) {
    alert("目前篩選條件下沒有題目，請調整條件。");
    return;
  }

  paperQuestions = [...pool]
    .sort(() => Math.random() - 0.5)
    .slice(0, Math.min(count, pool.length));

  answersVisible = false;
  renderPaper();
  document.getElementById("status").textContent =
    `符合條件 ${pool.length} 題，已抽出 ${paperQuestions.length} 題。`;
}

function renderPaper() {
  const title = document.getElementById("titleInput").value.trim()
    || "高中練習試卷";
  document.getElementById("paperTitle").textContent = title;

  const total = paperQuestions.reduce((sum, q) => {
    const p = Number(q["配分"]);
    return sum + (q["配分"] && Number.isFinite(p)
      ? p : Number(document.getElementById("points").value) || 0);
  }, 0);

  document.getElementById("paperInfo").textContent =
    `共 ${paperQuestions.length} 題｜總配分 ${total} 分`;

  document.getElementById("questions").innerHTML =
    paperQuestions.map((q, i) => {
      const options = ["A", "B", "C", "D"]
        .filter(k => q["選項" + k])
        .map(k =>
          `<div class="option">${k}. ${escapeHTML(q["選項" + k])}</div>`
        ).join("");

      const point = q["配分"] ||
        document.getElementById("points").value || "0";

      const answer = answersVisible
        ? `<div class="answer">
         【答案】<br>${escapeHTML(q["答案"] || "未填寫")}<br><br>
         【編號】<br>${escapeHTML(q["題號"] || "未填寫")}<br><br>
         【詳解】<br>${escapeHTML(q["解析"] || "暫無詳解")}
          </div>`
        : "";
      
      return `<article class="question">
        <div class="q-title">${i + 1}. ${escapeHTML(q["題目"])}
          （${escapeHTML(point)} 分）</div>
        ${options}
        ${answer}
      </article>`;
    }).join("");
}

function showAnswers() {
  if (!paperQuestions.length) {
    alert("請先組卷。");
    return;
  }
  answersVisible = !answersVisible;
  renderPaper();
}

function printPaper(answerOnly) {
  if (!paperQuestions.length) {
    alert("請先組卷。");
    return;
  }

  printAnswersOnly = answerOnly;
  const questions = document.getElementById("questions");
  const original = questions.innerHTML;

  if (answerOnly) {
    questions.innerHTML = paperQuestions.map((q, i) =>
      `<article class="question">
        <div class="q-title">${i + 1}. ${escapeHTML(q["題目"])}</div>
        <div class="answer">答案：${escapeHTML(q["答案"] || "未填寫")}</div>
        ${q["解析"] ? `<div class="explanation">解析：${escapeHTML(q["解析"])}</div>` : ""}
      </article>`
    ).join("");
    document.getElementById("paperTitle").textContent =
      (document.getElementById("titleInput").value || "高中練習試卷") + "－答案卷";
  }

  window.onafterprint = () => {
    questions.innerHTML = original;
    document.getElementById("paperTitle").textContent =
      document.getElementById("titleInput").value || "高中練習試卷";
    window.onafterprint = null;
  };

  window.print();

  if (answerOnly) {
    questions.innerHTML = original;
    document.getElementById("paperTitle").textContent =
      document.getElementById("titleInput").value || "高中練習試卷";
  }
}

["subject", "chapter", "type", "difficulty"].forEach(id => {
  document.getElementById(id).addEventListener("change", () => {
    const pool = filteredQuestions();
    document.getElementById("status").textContent =
      `目前符合條件 ${pool.length} 題。`;
  });
});

loadQuestions();
</script>
</body>
</html>
